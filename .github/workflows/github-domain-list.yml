name: GitHub Domain List → SmartDNS

on:
  schedule:
    - cron: '30 2 * * *'   # 每天凌晨 2:30 拉一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Fetch Loyalsoldier proxy-list.txt
      run: |
        fetch() {
          curl -fsSL --connect-timeout 10 -m 120 \
            "https://fastly.jsdelivr.net/gh/$1" -o "$2" || \
          curl -fsSL --connect-timeout 10 -m 120 \
            "https://raw.githubusercontent.com/$1" -o "$2"
        }

        fetch "Loyalsoldier/v2ray-rules-dat@release/proxy-list.txt" /tmp/proxy-list.txt
        fetch "Loyalsoldier/v2ray-rules-dat@release/china-list.txt" /tmp/china-list.txt
        fetch "521xueweihan/GitHub520@main/hosts" /tmp/gh520.hosts

        echo "proxy-list: $(wc -l < /tmp/proxy-list.txt) lines"
        echo "china-list: $(wc -l < /tmp/china-list.txt) lines"
        echo "gh520.hosts: $(wc -l < /tmp/gh520.hosts) lines"

    - name: Build github-domains.list
      run: |
        cd "$GITHUB_WORKSPACE"
        grep -i "github" /tmp/proxy-list.txt \
          | sed 's/^full://; s/^domainSuffix://; s/^domain://' \
          | grep -v "^#" \
          | grep -v "^$" \
          | grep -v "github\.cn" \
          | sort -u \
          > github-domains.list
        echo "github-domains.list = $(wc -l < github-domains.list)"
        cat github-domains.list

    - name: Build global-domains.list (china-list minus github)
      run: |
        cd "$GITHUB_WORKSPACE"
        # 先从 proxy-list 里拿 github 域名集合
        grep -i "github" /tmp/proxy-list.txt \
          | sed 's/^full://; s/^domainSuffix://; s/^domain://' \
          | grep -v "^#" | grep -v "^$" | grep -v "github\.cn" \
          | sort -u > /tmp/github-set.txt

        if [ -s /tmp/github-set.txt ]; then
          grep -ivFf /tmp/github-set.txt /tmp/china-list.txt \
            | grep -v "^#" | grep -v "^$" | sort -u \
            > global-domains.list
        else
          grep -v "^#" /tmp/china-list.txt | grep -v "^$" | sort -u > global-domains.list
        fi

        echo "global-domains.list = $(wc -l < global-domains.list) lines (github removed: $(wc -l < /tmp/github-set.txt))"

    - name: Build SmartDNS conf files
      run: |
        cd "$GITHUB_WORKSPACE"
        TS=$(date '+%F %T %Z')

        # github-hosts.smartdns.conf
        {
          echo "# Auto-generated: $TS"
          echo "# Group: github"
          while read -r d; do [ -n "$d" ] && echo "nameserver /$d/github"; done < github-domains.list
        } > github-hosts.smartdns.conf
        echo "github-hosts.smartdns.conf = $(wc -l < github-hosts.smartdns.conf)"

        # global-hosts.smartdns.conf
        {
          echo "# Auto-generated: $TS"
          echo "# Group: global"
          while read -r d; do [ -n "$d" ] && echo "nameserver /$d/global"; done < global-domains.list
        } > global-hosts.smartdns.conf
        echo "global-hosts.smartdns.conf = $(wc -l < global-hosts.smartdns.conf)"

        # github-hosts-address.smartdns.conf (GitHub520 静态 IP)
        if [ -s /tmp/gh520.hosts ]; then
          {
            echo "# Auto-generated: $TS"
            echo "# GitHub520 static IP fallback"
            sed 's/\r$//' /tmp/gh520.hosts \
              | grep -v "^#" | grep -v "Timeout" | grep -v "^$" \
              | awk '{print "address /" $2 "/" $1}'
          } > github-hosts-address.smartdns.conf
          echo "github-hosts-address.smartdns.conf = $(wc -l < github-hosts-address.smartdns.conf)"
        fi

    - name: Commit and push generated files
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # 显式 add 所有产物（忽略 .gitignore）
        git add -f github-domains.list
        git add -f github-hosts.smartdns.conf
        git add -f global-domains.list
        git add -f global-hosts.smartdns.conf
        [ -f github-hosts-address.smartdns.conf ] && git add -f github-hosts-address.smartdns.conf

        echo "=== git status ==="
        git status --short

        # 只有有变化才 commit
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "chore(auto): update domain lists [skip ci]"
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        echo "=== Done ==="
